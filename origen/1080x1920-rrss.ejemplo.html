<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>1080X1920-RRSS — Seminario</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --morado: #6F4EFC;
    --amarillo: #FCC460;
    --azul-oscuro: #0A1C42;
    --cian: #93F1F1;
    --fondo: #FAFAFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Poppins', sans-serif; background: var(--fondo); position: relative; }
  .abs { position: absolute; }

  /* Fondo (provisorio: reemplazar por PNG de fondo exportado por diseño) */
  .fondo { left: 0; top: 0; width: 1080px; height: 1920px; }
  .doodle-fondo { left: 360px; top: 1545px; width: 740px; height: 420px; opacity: 0.16; object-fit: contain; object-position: center top; }

  /* Encabezado */
  .pill-seminario {
    left: 62px; top: 277px; width: 490px; height: 88px; border-radius: 44px;
    background: var(--morado); color: #fff; font-weight: 700; font-size: 46px;
    line-height: 92px; padding-left: 26px; letter-spacing: -0.3px;
  }
  .pill-gratuito {
    left: 513px; top: 275px; width: 249px; height: 92px; border-radius: 46px;
    background: var(--amarillo); border: 5px solid #fff; color: var(--morado);
    font-weight: 700; font-size: 46px; line-height: 84px; text-align: center; letter-spacing: -0.3px;
  }
  .logo { left: 792px; top: 302px; width: 200px; }

  /* Título */
  .titulo {
    left: 78px; top: 410px; width: 930px;
    color: var(--azul-oscuro); font-size: 68px; line-height: 81px; font-weight: 400; letter-spacing: 0;
  }
  .titulo b { font-weight: 700; }

  /* Docentes */
  .docentes { left: 75px; top: 781px; width: 440px; height: 293px; display: flex; flex-direction: column; justify-content: flex-start; gap: 40px; }
  .docente { display: flex; align-items: center; gap: 23px; }
  .docente img { width: 125px; height: 125px; border-radius: 50%; object-fit: cover; flex: none; background: #DED4FE; object-position: center top; }
  .docente .rol { color: var(--morado); font-size: 28px; line-height: 36px; font-weight: 400; }
  .docente .nombre { color: var(--morado); font-size: 30px; line-height: 33px; font-weight: 600; width: 260px; letter-spacing: -0.3px; }
  .docentes.uno { justify-content: center; }
  .docentes.uno .docente img { width: 165px; height: 165px; }

  /* Bloque morado */
  .bloque { left: 0; top: 0; width: 1080px; height: 1920px; }
  .doodle { left: 525px; top: 800px; width: 490px; height: 285px; object-fit: contain; object-position: center bottom; }

  .fecha { left: 123px; top: 1147px; width: 278px; }
  .fecha img { display: block; width: 88px; height: 88px; margin: 0 0 0 95px; }
  .fecha .sep { width: 278px; height: 2px; background: #fff; margin: 19px 0 20px; }
  .fecha .dia { color: #fff; font-size: 39px; line-height: 46px; font-weight: 600; }
  .fecha .hora { color: #fff; font-size: 30px; line-height: 38px; font-weight: 500; }

  .certificado { left: 487px; top: 1204px; display: flex; align-items: center; gap: 10px; }
  .certificado img { width: 126px; height: 126px; }
  .certificado .l1 { color: #fff; font-size: 43px; line-height: 52px; font-weight: 400; }
  .certificado .l2 { color: var(--cian); font-size: 44px; line-height: 52px; font-weight: 700; }

  /* CTA */
  .cta {
    left: 94px; top: 1404px; width: 892px; height: 138px; border-radius: 69px;
    background: var(--amarillo); color: var(--morado); text-align: center;
    font-size: 44px; line-height: 138px; font-weight: 400; padding-top: 4px;
  }
  .cta b { font-weight: 600; }
  /* Varios países: "23 Octubre" en una línea + lista de horas con bandera */
  .fecham { left: 123px; top: 1150px; display: none; flex-direction: column; }
  .fecham .fm-dia { display: flex; align-items: baseline; gap: 14px; color: #fff; padding-left: 16px; }
  .fecham .n { font-size: 52px; line-height: 60px; font-weight: 700; }
  .fecham .m { font-size: 30px; line-height: 36px; font-weight: 600; }
  .fecham .fm-sep { width: 278px; height: 2px; background: #fff; margin: 10px 0 14px; }
  .fecham .fila { display: flex; align-items: center; gap: 24px; color: #fff; font-size: 33px; line-height: 49px; font-weight: 600; padding-left: 18px; white-space: nowrap; }
  .fecham .fila img { width: 38px; height: 38px; }
  .fecham.cuatro { top: 1138px; }
  .fecham.cuatro .fila { line-height: 40px; font-size: 30px; }
</style>
</head>

<div class="abs docentes" id="docentes"></div>

<img class="abs doodle" id="doodle" alt="">

<div class="abs fecha">
  <img id="bandera" alt="">
  <div class="sep"></div>
  <div class="dia" id="dia"></div><div class="hora" id="hora"></div>
</div>

<div class="abs fecham" id="fecham">
  <div class="fm-dia"><div class="n" id="m_num"></div><div class="m" id="m_mes"></div></div>
  <div class="fm-sep"></div>
  <div class="fm-lista" id="m_lista"></div>
</div>

<div class="abs certificado">
  <img id="icono_certificado" alt="">
  <div><div class="l1">Certificado de</div><div class="l2">Participación</div></div>
</div>

<div class="abs cta">¡Cupos Limitados! <b>Inscríbete ahora</b></div>

<script>
  const d = JSON.parse(document.getElementById('datos').textContent);
  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // Título: negrita hasta el primer ":" o "?" (incluido); sin ninguno → todo en negrita
  const t = d.nombre_programa.trim();
  const i = t.search(/[:?]/);
  document.getElementById('titulo').innerHTML = i === -1
    ? `<b>${esc(t)}</b>`
    : `<b>${esc(t.slice(0, i + 1))}</b> ${esc(t.slice(i + 1).trim())}`;

  // Título largo: baja el tamaño hasta que quepa en 360px de alto (4 o 5 líneas; mínimo 44px)
  const tit = document.getElementById('titulo');
  const ajustar = () => {
    let fs = 68;
    while (tit.offsetHeight > 360 && fs > 44) {
      fs -= 2; tit.style.fontSize = fs + 'px'; tit.style.lineHeight = Math.round(fs * 1.16) + 'px';
    }
    // La caja del doodle no puede tapar el título (base fija en y=1085)
    // Solo baja si alguna línea del título invade la zona del doodle (x > 525)
    const r = document.createRange(); r.selectNodeContents(tit);
    const invade = [...r.getClientRects()].filter(q => q.right > 525).reduce((m, q) => Math.max(m, q.bottom), 0);
    const top = Math.max(800, Math.round(invade) + 14);
    const dood = document.getElementById('doodle');
    dood.style.top = top + 'px'; dood.style.height = (1085 - top) + 'px';
  };

  // Fecha "2026-10-27" → "27 Octubre"; hora "21:00" → "21:00 hrs."
  const [, mm, dd] = d.fecha.split('-').map(Number);
  document.getElementById('dia').textContent = `${dd} ${MESES[mm - 1]}`;
  document.getElementById('hora').textContent = `${d.horario.trim()} hrs.`;

  // Varios países: día grande + una fila por país ("20:00 hrs. CHI"), en vez del bloque de 1 país
  const paises = d.paises || [];
  if (paises.length > 1) {
    document.querySelector('.fecha').style.display = 'none';
    const fm = document.getElementById('fecham');
    fm.style.display = 'flex';
    if (paises.length > 3) fm.classList.add('cuatro');
    document.getElementById('m_num').textContent = dd;
    document.getElementById('m_mes').textContent = MESES[mm - 1];
    document.getElementById('m_lista').innerHTML = paises
      .map(p => `<div class="fila"><img src="${esc(p.bandera)}" alt=""><span>${esc(p.hora)} hrs. ${esc(p.sigla)}</span></div>`)
      .join('');
  }

  // Docentes (solo los que vienen llenos); con 1 docente: centrado y foto más grande
  const lista = d.docentes.filter(x => x.nombre && x.nombre.trim());
  const cont = document.getElementById('docentes');
  if (lista.length === 1) cont.classList.add('uno');
  cont.innerHTML = lista
    .map(x => `<div class="docente"><img src="${esc(x.foto)}" alt="">
      <div><div class="rol">Docente</div><div class="nombre">${esc(x.nombre.trim())}</div></div></div>`)
    .join('');

  for (const k of ['bandera', 'logo', 'icono_certificado']) document.getElementById(k).src = d[k];


  // Doodle: recorta los márgenes transparentes y lo encaja en su caja (contain), sin tapar textos
  const recortar = src => new Promise(res => {
    const im = new Image();
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
        const g = c.getContext('2d'); g.drawImage(im, 0, 0);
        const px = g.getImageData(0, 0, c.width, c.height).data;
        let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
        for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++)
          if (px[(y * c.width + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        if (x1 < 0) return res(src);
        const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
        o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
        res(o.toDataURL('image/png'));
      } catch (e) { res(src); }
    };
    im.onerror = () => res(src);
    im.src = src;
  });

  Promise.all([document.fonts.ready, recortar(d.doodle)]).then(([, recortado]) => {
    document.getElementById('doodle').src = recortado;
    document.getElementById('doodle_fondo').src = recortado;
    ajustar();
  });
</script>
</body>
</html>
